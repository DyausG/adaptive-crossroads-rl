name: Verify project
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
      - name: Verify included data models and statistics
        run: python verify_repository.py
      - name: Run simulator and state tests
        run: python -m pytest tests -q -p no:cacheprovider --junitxml=results/ci/pytest.xml
      - name: Upload checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification
          path: results/ci/
